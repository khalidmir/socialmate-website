<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog & Resources | Professional Networking Tips, Event Insights | Social Mate</title>
    <meta name="description" content="Discover expert insights on professional networking, business events, and entrepreneurship in Dubai. Read tips from Social Mate's community of networking professionals.">
    <meta name="keywords" content="networking blog, business events Dubai, entrepreneur tips, professional networking advice">
    <meta name="robots" content="index, follow">
    <canonical>https://socialmate.org/blog.html</canonical>

    <!-- Open Graph -->
    <meta property="og:title" content="Blog & Resources | Professional Networking Tips & Event Insights | Social Mate">
    <meta property="og:description" content="Expert insights on professional networking, business events, and entrepreneurship in Dubai.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://socialmate.org/blog.html">
    <meta property="og:image" content="https://socialmate.org/assets/og-image.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blog & Resources | Social Mate Networking Events">
    <meta name="twitter:description" content="Expert insights on professional networking, business events, and entrepreneurship in Dubai.">
    <meta name="twitter:image" content="https://socialmate.org/assets/og-image.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f9fafb;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto;
        }

        nav {
            background: white;
            padding: 1rem 2rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 2rem;
            justify-content: center;
        }

        nav a {
            text-decoration: none;
            color: #667eea;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #764ba2;
        }

        .breadcrumb {
            background: white;
            padding: 1rem 2rem;
            font-size: 0.9rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .breadcrumb a {
            color: #667eea;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .blog-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .blog-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .blog-card-featured {
            border-top: 3px solid #667eea;
        }

        .blog-card-header {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
        }

        .blog-card-category {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            width: fit-content;
            margin-bottom: 0.8rem;
        }

        .blog-card-featured .blog-card-category {
            background: #764ba2;
        }

        .blog-card h3 {
            font-size: 1.4rem;
            line-height: 1.3;
            color: #1f2937;
        }

        .blog-card-body {
            padding: 1.5rem 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .blog-card-description {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            flex: 1;
        }

        .blog-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #999;
            font-size: 0.85rem;
            border-top: 1px solid #e5e7eb;
            padding-top: 1rem;
        }

        .blog-card-date {
            display: flex;
            gap: 0.5rem;
        }

        .blog-card-readtime {
            background: #f0f4ff;
            padding: 0.3rem 0.7rem;
            border-radius: 3px;
            color: #667eea;
        }

        footer {
            background: #1f2937;
            color: white;
            padding: 3rem 2rem;
            margin-top: 4rem;
            text-align: center;
        }

        footer p {
            margin-bottom: 1rem;
        }

        footer a {
            color: #667eea;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            nav {
                flex-direction: column;
                gap: 0.5rem;
            }

            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Social Mate Blog & Resources",
        "description": "Expert insights on professional networking, business events, and entrepreneurship in Dubai",
        "url": "https://socialmate.org/blog.html",
        "mainEntity": {
            "@type": "Blog",
            "name": "Social Mate Blog",
            "description": "Professional networking tips, event insights, and business community trends"
        }
    }
    </script>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://socialmate.org/"},
            {"@type": "ListItem", "position": 2, "name": "Blog", "item": "https://socialmate.org/blog.html"}
        ]
    }
    </script>
</head>
<body>
    <header>
        <h1>Blog & Resources</h1>
        <p>Expert insights on professional networking, business events, and entrepreneurship in Dubai</p>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/events.html">Events</a>
        <a href="/networking.html">Networking</a>
        <a href="/services.html">Services</a>
        <a href="/blog.html">Blog</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
    </nav>

    <div class="breadcrumb">
        <a href="/">Home</a> / Blog
    </div>

    <main>
        <div class="blog-grid" id="blog-grid"></div>
    </main>

    <footer>
        <p>&copy; 2026 Social Mate. All rights reserved.</p>
        <p><a href="/privacy.html">Privacy Policy</a> | <a href="/terms.html">Terms of Service</a> | <a href="/contact.html">Contact Us</a></p>
    </footer>

    <script>
        async function loadBlogPosts() {
            try {
                const response = await fetch('/blog-posts.json');
                const posts = await response.json();

                const grid = document.getElementById('blog-grid');

                // Sort posts by date (newest first)
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));

                posts.forEach(post => {
                    const card = document.createElement('a');
                    card.href = `/blog/${post.slug}.html`;
                    card.className = `blog-card ${post.featured ? 'blog-card-featured' : ''}`;

                    const date = new Date(post.date);
                    const formattedDate = date.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });

                    card.innerHTML = `
                        <div class="blog-card-header">
                            <span class="blog-card-category">${post.category}</span>
                            <h3>${post.title}</h3>
                        </div>
                        <div class="blog-card-body">
                            <p class="blog-card-description">${post.description}</p>
                            <div class="blog-card-meta">
                                <span class="blog-card-date">
                                    <span>📅</span>
                                    <span>${formattedDate}</span>
                                </span>
                                <span class="blog-card-readtime">${post.readTime} min read</span>
                            </div>
                        </div>
                    `;

                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading blog posts:', error);
                document.getElementById('blog-grid').innerHTML = '<p>Unable to load blog posts. Please try again later.</p>';
            }
        }

        loadBlogPosts();
    </script>
</body>
</html>
