  <style>
    .blog-hero {
      text-align: center;
      padding: 4rem 2rem;
      background: linear-gradient(135deg, var(--primary-darker), var(--primary-dark));
    }

    .blog-hero h1 {
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .blog-hero p {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
      color: var(--text-secondary);
    }

    .blog-section {
      background: var(--primary-dark);
      padding: 3rem 2rem;
    }

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .blog-card {
      background: var(--neutral-gray);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .blog-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-coral);
      box-shadow: 0 8px 24px rgba(255, 107, 74, 0.15);
    }

    .blog-card-header {
      background: linear-gradient(135deg, var(--accent-coral), var(--accent-orange));
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
    }

    .blog-card-category {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      width: fit-content;
      margin-bottom: 0.8rem;
      backdrop-filter: blur(10px);
    }

    .blog-card h3 {
      font-size: 1.3rem;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .blog-card-body {
      padding: 1.5rem 2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .blog-card-description {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      flex: 1;
    }

    .blog-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
    }

    .blog-card-date {
      display: flex;
      gap: 0.5rem;
    }

    .blog-card-readtime {
      background: rgba(255, 107, 74, 0.1);
      padding: 0.3rem 0.7rem;
      border-radius: 3px;
      color: var(--accent-coral);
      font-size: 0.8rem;
    }

    @media (max-width: 768px) {
      .blog-hero {
        padding: 2.5rem 1.5rem;
      }

      .blog-hero h1 {
        font-size: 1.8rem;
      }

      .blog-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <header>
    <nav class="container" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 0;">
      <div class="logo">
        <a href="/">
          <img src="/assets/images/logo.png" alt="Social Mate Logo" style="height: 50px; width: auto;">
        </a>
      </div>

      <ul class="nav-menu" style="list-style: none; display: flex; gap: 2.5rem;">
        <li><a href="/">Home</a></li>
        <li><a href="/events.html">Events</a></li>
        <li><a href="/networking.html">Networking</a></li>

        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>

  <!-- Hero Section -->
  <section class="blog-hero">
    <div class="container">
      <h1>Blog & Resources</h1>
      <p>Expert insights on professional networking, business events, and entrepreneurship in Dubai</p>
    </div>
  </section>

  <!-- Blog Section -->
  <section class="blog-section">
    <div class="container">
      <div class="blog-grid" id="blog-grid"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer style="background: rgba(15, 20, 25, 0.5); border-top: 1px solid rgba(58, 65, 72, 0.3); padding: 3rem 2rem; text-align: center; color: var(--text-secondary);">
    <div class="container">
      <p>&copy; 2026 Social Mate. All rights reserved.</p>
      <p>
        <a href="/privacy.html">Privacy Policy</a> |
        <a href="/terms.html">Terms of Service</a> |
        <a href="/contact.html">Contact Us</a>
      </p>
    </div>
  </footer>

  <script>
    async function loadBlogPosts() {
      try {
        const response = await fetch('/blog-posts.json');
        const posts = await response.json();

        const grid = document.getElementById('blog-grid');

        posts.sort((a, b) => new Date(b.date) - new Date(a.date));

        posts.forEach(post => {
          const card = document.createElement('a');
          card.href = `/blog/${post.slug}.html`;
          card.className = 'blog-card';
          card.style.textDecoration = 'none';
          card.style.color = 'inherit';

          const date = new Date(post.date);
          const formattedDate = date.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          });

          card.innerHTML = `
            <div class="blog-card-header">
              <span class="blog-card-category">${post.category}</span>
              <h3>${post.title}</h3>
            </div>
            <div class="blog-card-body">
              <p class="blog-card-description">${post.description}</p>
              <div class="blog-card-meta">
                <span class="blog-card-date">
                  <span>📅</span>
                  <span>${formattedDate}</span>
                </span>
                <span class="blog-card-readtime">${post.readTime} min read</span>
              </div>
            </div>
          `;

          grid.appendChild(card);
        });
      } catch (error) {
        console.error('Error loading blog posts:', error);
        document.getElementById('blog-grid').innerHTML = '<p style="color: var(--text-secondary);">Unable to load blog posts. Please try again later.</p>';
      }
    }

    loadBlogPosts();
  </script>
</body>
</html>
